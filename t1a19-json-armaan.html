console.log(data);

document.getelementbyid('mydiv01').innerhtml = <pre>${Myjson}</pre>;

document.getelementbyid('mydiv01').innerhtml += <img src="${data.image}" alt="random image" style="max-width: 100%; height: auto;"> ;
}
</script>
