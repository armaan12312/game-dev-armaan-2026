<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>t1a19-json-armaan.html</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
      background-color: #f4f7f6;
      color: #333;
    }
    h1 {
      color: #2c3e50;
    }
    select {
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background-color: #fff;
      cursor: pointer;
      width: 80%;
      max-width: 450px;
    }
    #mydiv01 {
      margin-top: 20px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: left;
    }
    pre {
      background: #f1f1f1;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin-top: 15px;
      display: block;
      margin-left: auto;
      margin-right: auto;
      max-height: 400px;
    }
    .custom-output {
      margin-top: 15px;
      padding: 15px;
      background: #eef2f3;
      border-left: 4px solid #3498db;
      font-size: 16px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h1 align="center">t1a19-json-armaan.html</h1>

  <!-- Dropdown containing 10 100% safe, family-friendly JSON APIs -->
  <select id="myselect" size="1" onchange="fetchdata(this.value)">
    <option value="">-- Select a JSON API Source (10 Working Options) --</option>
    <option value="https://randomfox.ca/floof/">1. Random Fox 🦊</option>
    <option value="https://dog.ceo/api/breeds/image/random">2. Random Dog 🐶</option>
    <option value="https://catfact.ninja/fact">3. Random Cat Fact 🐱</option>
    <option value="https://api.adviceslip.com/advice">4. Random Advice 💡</option>
    <option value="https://official-joke-api.appspot.com/random_joke">5. Clean Family Joke 🃏</option>
    <option value="https://api.ipify.org?format=json">6. Public IP Address 🌐</option>
    <option value="https://api.genderize.io?name=alex">7. Name Gender Predictor (Alex) 👤</option>
    <option value="https://api.agify.io?name=john">8. Name Age Predictor (John) 📊</option>
    <option value="https://jsonplaceholder.typicode.com/users/1">9. Sample User Profile 👤</option>
    <option value="https://jsonplaceholder.typicode.com/todos/1">10. Sample Todo Task ✅</option>
  </select>

  <br><br>

  <div id="mydiv01">Select an option from the dropdown above to load data...</div>

  <script>
    async function fetchdata(url) {
      if (!url) return;

      const displayDiv = document.getElementById('mydiv01');
      displayDiv.innerHTML = "<em>Loading JSON data...</em>";

      try {
        const response = await fetch(url);
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        console.log(data);

        // Format raw JSON with indentation
        const myjson = JSON.stringify(data, null, 2);
        let htmlContent = `<pre>${myjson}</pre>`;

        // Match data structure to render clean visual output below the JSON
        if (data.image) {
          htmlContent += `<img src="${data.image}" alt="API Image">`;
        } else if (data.message && typeof data.message === 'string' && data.message.includes("http")) {
          htmlContent += `<img src="${data.message}" alt="API Image">`;
        } else if (data.fact) {
          htmlContent += `<div class="custom-output"><strong>Cat Fact:</strong> ${data.fact}</div>`;
        } else if (data.slip) {
          htmlContent += `<div class="custom-output"><strong>Advice:</strong> "${data.slip.advice}"</div>`;
        } else if (data.setup && data.punchline) {
          htmlContent += `<div class="custom-output"><strong>Joke:</strong> ${data.setup}<br><em>${data.punchline}</em></div>`;
        } else if (data.ip) {
          htmlContent += `<div class="custom-output"><strong>Your IP Address:</strong> ${data.ip}</div>`;
        } else if (data.gender) {
          htmlContent += `<div class="custom-output"><strong>Name Prediction:</strong> "${data.name}" is likely <strong>${data.gender}</strong> (${Math.round(data.probability * 100)}% chance).</div>`;
        } else if (data.age) {
          htmlContent += `<div class="custom-output"><strong>Age Prediction:</strong> Estimated age for "${data.name}" is <strong>${data.age}</strong> years old.</div>`;
        } else if (data.email && data.username) {
          htmlContent += `<div class="custom-output"><strong>User Profile:</strong> ${data.name} (${data.email}) from ${data.address.city}</div>`;
        } else if (data.title && typeof data.completed !== 'undefined') {
          htmlContent += `<div class="custom-output"><strong>Todo Task:</strong> "${data.title}" — Completed: <strong>${data.completed}</strong></div>`;
        }

        displayDiv.innerHTML = htmlContent;

      } catch (error) {
        console.error("Error fetching data:", error);
        displayDiv.innerHTML = `<span style='color: red;'>Failed to load data. Error: ${error.message}</span>`;
      }
    }
  </script>

</body>
</html>
