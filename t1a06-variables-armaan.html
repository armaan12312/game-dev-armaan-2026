<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>t1a06-proper-and-varibles-armaan.html</title>
  <style>
    body {
      /* Soft font family */
      font-family: 'Quicksand', 'Nunito', 'Segoe UI', sans-serif;
      /* Soft, warm pastel background color */
      background-color: #fcefee;
      color: #4a4a4a;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background-color: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    h1 {
      color: #e06d73;
      margin-top: 0;
      font-size: 24px;
    }

    b { 
      color: #e06d73; 
    }

    button {
      background-color: #f7a399;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-family: inherit;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      margin-top: 20px;
      box-shadow: 0 4px 10px rgba(247, 163, 153, 0.3);
    }

    button:hover {
      background-color: #e06d73;
    }

    button:active {
      transform: scale(0.98);
    }

    #mydiv01 {
      margin-top: 25px;
      padding: 18px;
      background-color: #fff6f5;
      border: 1px dashed #f7a399;
      border-radius: 8px;
      font-size: 15px;
      color: #555555;
      line-height: 1.5;
      word-break: break-word;
    }
  </style>
  <script>
    function sayHello() {
      // Original variables
      let mynum = 5;
      let mystring = ' items in ';
      let myfloat = 99.9;
      let mybool = true;

      // Brand new variables added
      let studentName = 'Armaan';
      let subjectName = 'Computer Science';
      let gradeLevel = 11;
      let isEnrolled = true;
      let hobbyList = ['coding', 'gaming', 'reading'];
      let statsObj = { points: 100, rank: 'Gold' };

      // Fixed DOM reference (corrected getelementbyid to getElementById)
      let myout = document.getElementById('mydiv01');
      
      // Output displaying both old and newly added variables
      myout.innerHTML = `Student: <b>${studentName}</b> (${subjectName}, Grade ${gradeLevel})<br>` +
                        `Inventory: ${mynum}${mystring}stock, Price: $${myfloat}<br>` +
                        `Hobbies: ${hobbyList.join(', ')} | Rank: ${statsObj.rank}`;
      
      if (mybool && isEnrolled) {
        myout.innerHTML += '<br><b style="color: #6c5ce7;">Status: Active & Enrolled, WOW!</b>';
      }
    }
  </script>
</head>
<body>
  <div class="card">
    <h1>Variable</h1>
    <p>This is <b style="color:#e06d73">bold</b> text</p>
    
    <!-- Fixed function name case and ID syntax -->
    <button onclick="sayHello()">Click Me</button>
    
    <div id="mydiv01">...</div>
  </div>
</body>
</html>
